<div class="modal fade" id="modalEditarLibro" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-bottom-0 pt-4 px-4">
                <div>
                    <h5 class="fw-bold mb-1">Seleccionar libro para modificar</h5>
                    <p class="text-muted small mb-0">Busca por título o autor, o selecciona manualmente un libro de la lista.</p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body px-4 pb-4">
                <form action="#" method="GET" class="row g-2 mb-4">
                    <div class="col-md-5">
                        <label class="form-label small fw-bold">Título</label>
                        <input type="text" name="titulo" placeholder="Título del libro" class="form-control">
                    </div>
                    <div class="col-md-5">
                        <label class="form-label small fw-bold">Autor</label>
                        <input type="text" name="autor" placeholder="Nombre del autor" class="form-control">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-dark w-100">Buscar</button>
                    </div>
                </form>

                <h6 class="text-muted small fw-bold text-uppercase mb-3">Libros cargados</h6>
                <div class="list-group">
                    {% if libros %}
                        {% for libro in libros %}
                        <button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3">
                            <div>
                                <h6 class="mb-1 fw-bold">{{ libro.titulo }}</h6>
                                <small class="text-muted">{{ libro.autor }}</small>
                            </div>
                            <span class="badge bg-success bg-opacity-10 text-success border border-success rounded-pill px-3 py-2">Disponible</span>
                        </button>
                        {% endfor %}
                    {% else %}
                        <div class="text-center text-muted py-4 border rounded bg-light">
                            No hay libros cargados en el sistema.
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
