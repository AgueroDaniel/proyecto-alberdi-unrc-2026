<div class="table-responsive border rounded mt-2">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light text-muted small">
            <tr>
                <th class="ps-3 py-3">LIBRO</th>
                <th class="py-3">AUTOR</th>
                <th class="py-3">GÉNERO</th>
                <th class="py-3 text-center">TOTALES</th>
                <th class="py-3 text-center">DISPONIBLES</th>
            </tr>
        </thead>
        <tbody>
            {% if libros %}
                {% for libro in libros %}
                <tr>
                    <td class="ps-3 fw-bold">{{ libro.titulo }}</td>
                    <td>{{ libro.autor }}</td>
                    <td>{{ libro.genero }}</td>
                    <td class="text-center">{{ libro.total_ejemplares }}</td>
                    <td class="text-center">{{ libro.disponibles }}</td>
                </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="5" class="text-center py-5 text-muted">
                        No hay libros registrados en el catálogo.
                    </td>
                </tr>
            {% endif %}
        </tbody>
    </table>
</div>
