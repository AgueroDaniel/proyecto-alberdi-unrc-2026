<div class="modal fade" id="modalPrestamo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-bottom-0 pt-4 px-4">
                <div>
                    <h5 class="fw-bold mb-1">Registrar préstamo</h5>
                    <p class="text-muted small mb-0">Indica qué libro se entrega y a quién.</p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <form action="#" method="POST" class="modal-body px-4 pb-4">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Libro *</label>
                    <input list="lista-libros" required name="libro_id" placeholder="Escribe para buscar un libro..." class="form-control">
                    <datalist id="lista-libros">
                        {% for libro in libros %}
                            {% if libro.disponibles > 0 %}
                            <option value="{{ libro.titulo }} - {{ libro.autor }}">
                            {% endif %}
                        {% endfor %}
                    </datalist>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Prestado a (Lector) *</label>
                    <input type="text" required name="lector" placeholder="Ej. Juan Pérez" class="form-control">
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Fecha prevista de devolución *</label>
                    <input type="date" required name="fecha_devolucion" class="form-control">
                </div>
                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <!-- Actualizado a .btn-rojo -->
                    <button type="submit" class="btn btn-rojo">Confirmar préstamo</button>
                </div>
            </form>
        </div>
    </div>
</div>
