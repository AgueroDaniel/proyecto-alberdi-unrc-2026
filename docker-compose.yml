services:
  db:
    image: mariadb:10.11
    container_name: alberdi_mariadb
    restart: always
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1" 
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - ./instance:/var/lib/mysql

  flask_app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - FLASK_APP=app:create_app
      - DATABASE_URL=${DB_URL} # conectar al otro container
    command: ["flask", "run", "--host=0.0.0.0"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy